name: Mail credential safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  credential-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_resend_configuration.py -v

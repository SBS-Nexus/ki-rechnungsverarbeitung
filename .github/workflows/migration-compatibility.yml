name: PostgreSQL migration compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: invoice_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:isolated-ci-only@127.0.0.1:5432/invoice_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt alembic==1.14.1
      - run: python -m pip check
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest migration_tests/ -q
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head

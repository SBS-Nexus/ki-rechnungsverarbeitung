name: PDF parser compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pdf-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and parser test dependencies
        run: >-
          python -m pip install -r requirements.txt -r requirements-test.txt
          pdfplumber==0.11.11 pytesseract==0.3.13 pdf2image==1.17.0 reportlab==5.1.0
      - run: python -m pip check
      - run: python -m pytest parser_tests/ -q

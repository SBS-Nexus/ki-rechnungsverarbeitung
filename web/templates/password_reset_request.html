<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen - SBS Deutschland</title>
    <link rel="stylesheet" href="/static/css/design-tokens.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #003856 0%, #005580 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #003856; font-size: 28px; margin-bottom: 5px; }
        .logo p { color: #FFB900; font-size: 14px; }
        h2 { color: #003856; margin-bottom: 10px; text-align: center; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #003856;
            box-shadow: 0 0 0 3px rgba(0,56,86,0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: #003856;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { background: #005580; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,56,86,0.3); }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #003856; text-decoration: none; font-size: 14px; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔐 SBS Deutschland</h1>
            <p>Smart Business Service</p>
        </div>
        
        <h2>Passwort zurücksetzen</h2>
        <p class="subtitle">Geben Sie Ihre E-Mail-Adresse ein und wir senden Ihnen einen Link zum Zurücksetzen.</p>
        
        {% if success %}
        <div class="success">
            ✅ E-Mail wurde gesendet! Prüfen Sie Ihr Postfach.
        </div>
        {% endif %}
        
        {% if error %}
        <div class="error">
            ❌ {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/password-reset/request">
            <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
            <div class="form-group">
                <label for="email">E-Mail-Adresse</label>
                <input type="email" id="email" name="email" required placeholder="ihre@email.de">
            </div>
            
            <button type="submit">📧 Reset-Link senden</button>
        </form>
        
        <div class="back-link">
            <a href="/login">← Zurück zum Login</a>
        </div>
    </div>
<!-- SBS Chat Widget -->
<link rel="stylesheet" href="https://chat.sbsdeutschland.com/static/chat-widget.css">
<script src="https://chat.sbsdeutschland.com/static/chat-widget.js" defer></script>
</body>
</html>

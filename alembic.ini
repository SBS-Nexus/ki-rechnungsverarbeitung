# Alembic-Konfiguration – SBS KI-Rechnungsverarbeitung
# Die Datenbank-URL wird NICHT hier hinterlegt, sondern zur Laufzeit aus der
# Umgebungsvariablen DATABASE_URL gelesen (siehe migrations/env.py).
# Beispiel (Neon):
#   DATABASE_URL="postgresql+psycopg://USER:PASS@ep-xxx.eu-central-1.aws.neon.tech/dbname?sslmode=require"

[alembic]
script_location = migrations
prepend_sys_path = .
# Zeitzonenbehaftete Versions-Zeitstempel
timezone = UTC

# sqlalchemy.url wird in env.py aus DATABASE_URL gesetzt.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
